<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite App</title>
</head>

<body>
  <div id="root">
    <header class="header">
      <div class="header__inner">

        <div class="header__logo">
          <div>
            <img class="header__logo-icon" src="/burger.svg" alt="burger">
          </div>

          <div class="header__logo-wrapper">
            <img src="/Shape.svg" alt="youtube">
            <span class="header__logo-item logo">YouTube</span>
            <span class="header__logo-name logo">Margaret Phelps</span>
          </div>

        </div>

        <div class="header__input">
          <input class="header__input-input" name="video" type="text" placeholder="Search">
          <img class="header__input-search" src="/search.svg" alt="search">
        </div>

        <div class="header__icons">

          <div class="cl-toggle-switch">
            <label class="cl-switch">
              <input class="input-theme" type="checkbox">
              <span></span>
            </label>
          </div>

          <div>
            <img class="icon" src="/phone.svg" alt="phone">
          </div>
          <div>
            <img class="icon" src="/sape.svg" alt="sape">
          </div>
          <div class="header__icons-wrap">
            <img class="icon" src="/ring.svg" alt="ring">
            <span class="header__icons-circle">3</span>
          </div>
          <div>
            <img src="/user.png" alt="user">
          </div>
          <div class="header__icons-dots">
            <img class="icon" src="/dots.svg" alt="dots">
          </div>
        </div>
      </div>
    </header>

    <aside>
      <nav>
        <ul>

        </ul>
      </nav>
      
    </aside>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
